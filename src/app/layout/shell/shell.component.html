<div class="app-shell">
  <aside class="app-sidebar">
    <div class="app-brand">
      <div class="app-brand-icon">
        <i class="pi pi-building"></i>
      </div>
      <span class="app-brand-name">Gestion Immobilière</span>
    </div>

    <nav class="app-nav">
      @for (item of navItems; track item.route) {
        <a
          class="app-nav-item"
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
        >
          <i [class]="item.icon"></i>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <div class="app-main">
    <header class="app-topbar">
      <div class="app-topbar-org">
        <span class="icon-box icon-box-sm icon-box-primary"><i class="pi pi-briefcase"></i></span>
        <div>
          <div class="app-topbar-org-name">{{ session()?.organizationName }}</div>
          <div class="app-topbar-org-sub">Organisation active</div>
        </div>
      </div>

      <div class="app-topbar-user">
        <p-avatar [label]="initials()" shape="circle" styleClass="app-user-avatar" />
        <div class="app-topbar-user-info">
          <div class="app-topbar-user-name">{{ session()?.displayName }}</div>
          <div class="app-topbar-user-sub">Connecté</div>
        </div>
        <p-button icon="pi pi-sign-out" [text]="true" [rounded]="true" severity="secondary" (onClick)="logout()" pTooltip="Déconnexion" />
      </div>
    </header>

    <main class="app-content">
      <router-outlet />
    </main>
  </div>
</div>
