<div class="page-header">
  <div>
    <h1>Locataires</h1>
    <p>Personnes occupant une unité par bail, avec ou sans cotitulaires.</p>
  </div>
  <p-button label="Nouveau locataire" icon="pi pi-user-plus" (onClick)="openDialog()" />
</div>

<div class="surface-card">
  <p-table [value]="tenants()" [loading]="loading()" dataKey="id" [rowHover]="true" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>Nom</th>
        <th>Courriel</th>
        <th>Téléphone</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-tenant>
      <tr>
        <td>
          <div class="entity-name">
            <span class="icon-box icon-box-sm icon-box-neutral"><i class="pi pi-user"></i></span>
            {{ tenant.firstName }} {{ tenant.lastName }}
          </div>
        </td>
        <td>{{ tenant.email || '—' }}</td>
        <td>{{ tenant.phone || '—' }}</td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3" class="empty-state">
          <i class="pi pi-users"></i>
          <p>Aucun locataire pour le moment.</p>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog header="Nouveau locataire" [modal]="true" [(visible)]="dialogVisible" [style]="{ width: '30rem' }">
  <form [formGroup]="form" (ngSubmit)="submit()" class="entity-form">
    <div class="field-row">
      <div class="field">
        <label for="firstName">Prénom <span class="required-mark">*</span></label>
        <input pInputText id="firstName" formControlName="firstName" class="w-full" placeholder="Marie" />
      </div>
      <div class="field">
        <label for="lastName">Nom <span class="required-mark">*</span></label>
        <input pInputText id="lastName" formControlName="lastName" class="w-full" placeholder="Gagnon" />
      </div>
    </div>
    <div class="field">
      <label for="email">Courriel</label>
      <input pInputText id="email" formControlName="email" class="w-full" placeholder="marie@example.com" />
    </div>
    <div class="field">
      <label for="phone">Téléphone</label>
      <input pInputText id="phone" formControlName="phone" class="w-full" placeholder="514-555-0101" />
    </div>
    <div class="dialog-actions">
      <p-button label="Annuler" severity="secondary" [text]="true" (onClick)="dialogVisible.set(false)" type="button" />
      <p-button label="Créer" icon="pi pi-user-plus" type="submit" [loading]="submitting()" />
    </div>
  </form>
</p-dialog>
